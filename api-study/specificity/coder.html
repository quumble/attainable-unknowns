<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attainable Unknowns — Blinded Specificity Coder</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --ink: #24231f;
      --muted: #69665d;
      --line: #d7d1c3;
      --accent: #285a4a;
      --accent-ink: #fff;
      --warn: #8a3f28;
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191a18;
        --panel: #232420;
        --ink: #f1eee5;
        --muted: #b9b4a9;
        --line: #47483f;
        --accent: #72b59c;
        --accent-ink: #10251e;
        --warn: #f0a084;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    main { width: min(880px, calc(100% - 32px)); margin: 32px auto 64px; }
    h1 { font-size: clamp(1.55rem, 4vw, 2.25rem); margin: 0 0 8px; }
    .subtle { color: var(--muted); line-height: 1.45; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: clamp(18px, 4vw, 34px);
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
      margin-top: 20px;
    }
    .setup { display: grid; gap: 12px; }
    label { font-weight: 650; }
    input[type="file"], input[type="text"] {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: 8px; background: transparent; color: inherit;
    }
    .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 700px) { .meta-grid { grid-template-columns: 1fr; } }
    button {
      border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px;
      font: inherit; font-weight: 700; background: var(--panel); color: var(--ink);
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary, button.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #coder { display: none; }
    .status-row { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
    .card-id { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .86rem; }
    .question { font-size: clamp(1.35rem, 3.5vw, 2rem); line-height: 1.3; margin: 28px 0; }
    .passage-label { color: var(--muted); font-size: .83rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .passage { line-height: 1.65; font-size: 1.08rem; border-left: 3px solid var(--line); padding-left: 18px; }
    .codes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 30px 0 18px; }
    .codes button { min-height: 72px; font-size: 1.03rem; }
    .codes small { display: block; font-weight: 400; margin-top: 4px; }
    .nav { display: flex; justify-content: space-between; gap: 12px; }
    .notice { color: var(--warn); font-weight: 650; }
    .complete { color: var(--accent); font-weight: 750; }
    kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
<main>
  <h1>Blinded specificity coder</h1>
  <p class="subtle">Local-only keyboard interface. It does not load network resources. Use <kbd>1</kbd>, <kbd>0</kbd>, or <kbd>U</kbd>; each code saves immediately and advances.</p>

  <section class="panel setup" id="setup">
    <label for="packetFile">Blinded packet JSON</label>
    <input id="packetFile" type="file" accept="application/json,.json">
    <div class="meta-grid">
      <div><label for="service">Service (optional)</label><input id="service" type="text" placeholder="e.g. human / ChatGPT"></div>
      <div><label for="model">Model or coder (optional)</label><input id="model" type="text" placeholder="if known"></div>
      <div><label for="settings">Settings (optional)</label><input id="settings" type="text" placeholder="if known"></div>
    </div>
    <button class="primary" id="start" disabled>Open packet</button>
    <p id="setupMessage" class="subtle"></p>
  </section>

  <section class="panel" id="coder">
    <div class="status-row">
      <strong id="progress"></strong>
      <span class="card-id" id="cardId"></span>
    </div>
    <div class="question" id="question"></div>
    <div class="passage-label">Passage</div>
    <div class="passage" id="passage"></div>
    <div class="codes">
      <button data-code="1"><kbd>1</kbd> Specific<small>Distinct informational target</small></button>
      <button data-code="0"><kbd>0</kbd> Generic<small>Only asks for more or elaboration</small></button>
      <button data-code="U"><kbd>U</kbd> Uncertain<small>Cannot confidently assign 0 or 1</small></button>
    </div>
    <div class="nav">
      <button id="back">← Back</button>
      <button id="next">Next →</button>
      <button class="primary" id="download" disabled>Download complete JSON</button>
    </div>
    <p id="message" class="subtle"></p>
  </section>
</main>
<script>
(() => {
  "use strict";
  const state = { packet: null, codes: {}, index: 0, startedAt: null };
  const $ = id => document.getElementById(id);
  const packetFile = $("packetFile");
  const start = $("start");
  const coder = $("coder");
  const setup = $("setup");
  const codeButtons = [...document.querySelectorAll("[data-code]")];

  function storageKey() {
    return `au-specificity:${state.packet.packet_id}:${state.packet.coder_id}`;
  }

  function validatePacket(packet) {
    if (!packet || packet.schema_version !== "au-specificity-packet-v1") throw new Error("Wrong packet schema.");
    if (!packet.packet_id || !packet.coder_id || !Array.isArray(packet.cards)) throw new Error("Packet metadata or cards missing.");
    const ids = packet.cards.map(card => card.card_id);
    if (new Set(ids).size !== ids.length) throw new Error("Duplicate card IDs.");
    for (const card of packet.cards) {
      if (typeof card.card_id !== "string" || typeof card.question !== "string" || typeof card.passage !== "string") {
        throw new Error("A card is missing its ID, question, or passage.");
      }
    }
  }

  function loadSaved() {
    const saved = localStorage.getItem(storageKey());
    if (!saved) return;
    try {
      const value = JSON.parse(saved);
      if (value.packet_id === state.packet.packet_id && value.coder_id === state.packet.coder_id) {
        state.codes = value.codes || {};
        state.index = Math.min(value.index || 0, Math.max(0, state.packet.cards.length - 1));
        state.startedAt = value.started_at_utc || state.startedAt;
      }
    } catch (_) { /* Ignore a malformed local draft. */ }
  }

  function save() {
    localStorage.setItem(storageKey(), JSON.stringify({
      packet_id: state.packet.packet_id,
      coder_id: state.packet.coder_id,
      codes: state.codes,
      index: state.index,
      started_at_utc: state.startedAt
    }));
  }

  function firstUncoded() {
    return state.packet.cards.findIndex(card => !state.codes[card.card_id]);
  }

  function render() {
    const cards = state.packet.cards;
    const card = cards[state.index];
    const coded = Object.keys(state.codes).filter(id => cards.some(card => card.card_id === id)).length;
    $("progress").textContent = `${coded} / ${cards.length} coded • card ${state.index + 1} / ${cards.length}`;
    $("cardId").textContent = card.card_id;
    $("question").textContent = card.question;
    $("passage").textContent = card.passage;
    for (const button of codeButtons) button.classList.toggle("selected", state.codes[card.card_id] === button.dataset.code);
    $("back").disabled = state.index === 0;
    $("next").disabled = state.index === cards.length - 1;
    $("download").disabled = coded !== cards.length;
    $("message").className = coded === cards.length ? "complete" : "subtle";
    $("message").textContent = coded === cards.length
      ? "Packet complete. Download the JSON and preserve it unchanged."
      : "Autosaved in this browser. Question first; passage is available for local reference resolution.";
  }

  function setCode(code) {
    const card = state.packet.cards[state.index];
    state.codes[card.card_id] = code;
    const next = firstUncoded();
    if (next >= 0) state.index = next;
    save();
    render();
  }

  packetFile.addEventListener("change", async () => {
    start.disabled = true;
    $("setupMessage").textContent = "";
    const file = packetFile.files[0];
    if (!file) return;
    try {
      const packet = JSON.parse(await file.text());
      validatePacket(packet);
      state.packet = packet;
      $("setupMessage").textContent = `${packet.coder_id}: ${packet.cards.length} cards loaded.`;
      start.disabled = false;
    } catch (error) {
      $("setupMessage").textContent = `Cannot load packet: ${error.message}`;
      $("setupMessage").className = "notice";
    }
  });

  start.addEventListener("click", () => {
    state.codes = {};
    state.index = 0;
    state.startedAt = new Date().toISOString();
    loadSaved();
    setup.style.display = "none";
    coder.style.display = "block";
    render();
  });

  for (const button of codeButtons) button.addEventListener("click", () => setCode(button.dataset.code));
  $("back").addEventListener("click", () => { if (state.index > 0) { state.index--; save(); render(); } });
  $("next").addEventListener("click", () => { if (state.index < state.packet.cards.length - 1) { state.index++; save(); render(); } });

  document.addEventListener("keydown", event => {
    if (coder.style.display !== "block" || ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    if (event.key === "1") setCode("1");
    else if (event.key === "0") setCode("0");
    else if (event.key.toLowerCase() === "u") setCode("U");
    else if (event.key === "ArrowLeft" && state.index > 0) { state.index--; save(); render(); }
    else if (event.key === "ArrowRight" && state.index < state.packet.cards.length - 1) { state.index++; save(); render(); }
  });

  $("download").addEventListener("click", () => {
    const codes = state.packet.cards.map(card => ({ card_id: card.card_id, code: state.codes[card.card_id] }));
    if (codes.some(row => !row.code)) return;
    const output = {
      schema_version: "au-specificity-codes-v1",
      packet_id: state.packet.packet_id,
      coder_id: state.packet.coder_id,
      coder_metadata: {
        service: $("service").value || null,
        model: $("model").value || null,
        settings: $("settings").value || null,
        started_at_utc: state.startedAt,
        completed_at_utc: new Date().toISOString(),
        interface: "api-study/specificity/coder.html"
      },
      codes
    };
    const blob = new Blob([JSON.stringify(output, null, 2) + "\n"], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `${state.packet.coder_id}_CODES.json`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  });
})();
</script>
</body>
</html>
