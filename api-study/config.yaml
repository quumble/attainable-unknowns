study_version: api-pilot-0.1
replicates: 25
order_seed: 91826
max_output_tokens: 80

system_prompt: >-
  You are participating in a study of responses to informational passages.
  Each request is independent. Follow the response format exactly.

user_instruction: |-
  Read the passage below.

  Output exactly one line.

  That line must be either:
  - one specific follow-up question that naturally stands out after reading the passage, ending in a question mark; or
  - NONE, if no particular follow-up question stands out.

  Use NONE freely. Do not invent a question merely because the task asks whether one exists.
  Do not output more than one question.
  Do not explain your choice, add a preface, or answer the question.

